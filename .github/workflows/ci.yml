name: Node CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          FIREBASE_PROJECT_ID: dummy
          FIREBASE_CLIENT_EMAIL: dummy@dummy
          FIREBASE_PRIVATE_KEY: "dummy"
